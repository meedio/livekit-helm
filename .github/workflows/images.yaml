name: Build patched LiveKit images

# Rebuilds the upstream LiveKit releases described in images/<image>/image.env.
# Pull requests build, verify and scan without pushing. On master each image is pushed to
# Harbor once per IMAGE_TAG: bump the tag in image.env to publish a new build, so a digest
# a chart already pins is never overwritten.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/images.yaml'
  push:
    branches:
      - master
    paths:
      - 'images/**'
      - '.github/workflows/images.yaml'

permissions:
  id-token: write
  contents: read

env:
  GRYPE_VERSION: v0.121.0

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted-vms
    strategy:
      fail-fast: false
      matrix:
        image: [livekit-server, ingress, egress]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build context
        id: prep
        run: images/prepare.sh "${{ matrix.image }}" "${{ github.workspace }}/.build/${{ matrix.image }}"

      - name: Build image
        run: |
          docker buildx build --load \
            -t "${{ steps.prep.outputs.image }}" \
            -f "${{ steps.prep.outputs.dockerfile }}" \
            "${{ steps.prep.outputs.context }}"

      - name: Verify toolchain and modules
        run: images/verify.sh "${{ matrix.image }}" "${{ steps.prep.outputs.image }}"

      - name: Scan with Grype
        continue-on-error: true
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/grype-bin"
          mkdir -p "$bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$bin" "$GRYPE_VERSION"
          {
            echo "## Grype: \`${{ steps.prep.outputs.image }}\` (not pushed)"
            echo
            echo '```'
            "$bin/grype" "docker:${{ steps.prep.outputs.image }}" -o table
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted-vms
    strategy:
      fail-fast: false
      matrix:
        image: [livekit-server, ingress, egress]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Harbor credentials from Vault
        uses: hashicorp/vault-action@v2
        with:
          method: jwt
          url: https://vault.admin-general.meedio.eu
          role: github-pipeline
          secrets: |
            kv/data/harbor cicd-user | HARBOR_USER ;
            kv/data/harbor cicd-password | HARBOR_PASSWORD ;

      - name: Skip a tag that is already published
        id: exists
        run: |
          set -euo pipefail
          . images/common.env
          . "images/${{ matrix.image }}/image.env"
          image="$REGISTRY/$REGISTRY_PROJECT/$APP_NAME:$IMAGE_TAG"
          echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published; bump IMAGE_TAG to rebuild" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Prepare build context
        if: steps.exists.outputs.skip == 'false'
        id: prep
        run: images/prepare.sh "${{ matrix.image }}" "${{ github.workspace }}/.build/${{ matrix.image }}"

      - name: Build, scan, push and sign
        if: steps.exists.outputs.skip == 'false'
        uses: meedio/actions/docker-build@v3
        with:
          app-name: ${{ steps.prep.outputs.app-name }}
          version: ${{ steps.prep.outputs.image-tag }}
          context: ${{ steps.prep.outputs.context }}
          dockerfile-path: ${{ steps.prep.outputs.dockerfile }}
          skip-checkout: 'true'
          description: Patched rebuild of ${{ matrix.image }}, see images/${{ matrix.image }}/image.env in ${{ github.repository }}@${{ github.sha }}

      - name: Verify toolchain and modules
        if: steps.exists.outputs.skip == 'false'
        run: images/verify.sh "${{ matrix.image }}" "${{ steps.prep.outputs.image }}"

      - name: Record digest
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${{ steps.prep.outputs.image }}")"
          {
            echo "## ${{ matrix.image }}"
            echo
            echo "- tag: \`${{ steps.prep.outputs.image }}\`"
            echo "- digest: \`${ref#*@}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
