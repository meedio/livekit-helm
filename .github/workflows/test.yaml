# based on: https://github.com/nats-io/k8s/blob/main/.github/workflows/test.yaml and https://github.com/helm/charts-repo-actions-demo/blob/main/.github/workflows/lint-test.yaml
name: Lint, Install, and Test Charts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ingress/**'
      - 'egress/**'
      - 'livekit-server/**'
      - '.github/workflows/test.yaml'

jobs:
  lint-test:
    runs-on: self-hosted-vms
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "1.26"
            node_image: kindest/node:v1.26.6
          - k8s: "1.25"
            node_image: kindest/node:v1.25.11
          - k8s: "1.24"
            node_image: kindest/node:v1.24.15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.11.2

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: |-
          ct lint \
            --all \
            --chart-dirs egress ingress livekit-server \
            --validate-maintainers=false

      - name: Create k8s cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: v0.20.0
          cluster_name: ct-${{ matrix.k8s }}
          node_image: ${{ matrix.node_image }}

      - name: Run chart-testing (install)
        run: |-
          ct install \
            --all \
            --chart-dirs egress ingress livekit-server
