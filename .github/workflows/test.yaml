name: Lint and Render Charts

# Lints the charts and renders each one in the layouts we deploy. There is no install
# test: the charts need real keys and Redis to start, and kind clusters collide on the
# shared self-hosted runners.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ingress/**'
      - 'egress/**'
      - 'livekit-server/**'
      - 'scripts/render-charts.sh'
      - '.github/workflows/test.yaml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: self-hosted-vms
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      # ct lint runs Yamale and yamllint, which need Python. chart-testing-action keeps their
      # virtualenv in the self-hosted runners' persistent tool cache, built with Python 3.9;
      # another version cannot load it (libpython3.9.so missing).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Lint charts
        run: |-
          ct lint \
            --all \
            --chart-dirs . \
            --validate-maintainers=false

      - name: Render charts
        run: scripts/render-charts.sh
