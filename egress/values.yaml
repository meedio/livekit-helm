# Default values for egress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/egress
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""
  # Optional sha256 digest; when set the pull is pinned to it (repository:tag@digest).
  digest: ""

# Rendered as the egress config.yaml. Since egress v1.15.0 a request-supplied S3
# assume_role_external_id is rejected; set s3_assume_role_external_id for a server-side
# default, or s3_allow_request_assume_role_external_id: true (deprecated) to accept it.
egress:
  log_level: info
  health_port: 8080
  prometheus_port: 9090

terminationGracePeriodSeconds: 3600

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

nodeSelector: {}

resources: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext: {}

securityContext: {}

tolerations: []

affinity: {}

deploymentStrategy: {}
