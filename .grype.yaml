# Grype ignore rules for the images the charts pin by default.
#
# The charts already use the latest upstream releases. Each rule below is a Critical or High
# finding those releases still carry, scoped to the exact package version, so it stops
# matching as soon as an upstream image ships the fix. When bumping an image, rescan it
# and delete the rules that no longer apply.
#
# Scanned 11 November 2026, Grype 0.121.0, linux/amd64. Medium and lower findings are not
# listed; they are reported but do not fail a High gate. The OpenSSL 3.5.9-r0 rules were
# added 20 November 2026: Alpine published the fix (3.5.9-r1) after the newest upstream
# images were built, so they carry a reason and a review-by date.
ignore:

  # --- livekit/livekit-server:v1.13.11 ---

  # golang.org/x/net v0.59.0 (go-module): upstream livekit/livekit-server:v1.13.11 has not picked up the fix yet.
  - vulnerability: GO-2026-6603  # High; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  - vulnerability: GO-2026-6611  # High; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  - vulnerability: GO-2026-6612  # Critical; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  - vulnerability: GO-2026-6617  # High; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module

  # zlib 1.3.2-r1 (apk): upstream livekit/livekit-server:v1.13.11 has not picked up the fix yet.
  # The chart's test image carries the same package: alpine:3.24.3, and alpine:3.24.4 as well.
  - vulnerability: CVE-2026-4738  # Critical; fixed in 1.4-r0
    package:
      name: zlib
      version: 1.3.2-r1
      type: apk

  # libcrypto3 and libssl3 3.5.9-r0 (apk): Alpine fixed them in 3.5.9-r1, but no upstream
  # image ships it yet. livekit/livekit-server:v1.13.11 is the newest release and its base is
  # alpine 3.24.3; the chart's test image is alpine:3.24.3, and alpine:3.24.4 (the newest
  # 3.24) still has 3.5.9-r0 too.
