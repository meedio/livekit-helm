# Grype ignore rules for the images the charts pin by default.
#
# The charts already use the latest upstream releases. Each rule below is a Critical or High
# finding those releases still carry, scoped to the exact package version, so it stops
# matching as soon as an upstream image ships the fix. When bumping an image, rescan it
# and delete the rules that no longer apply.
#
# Scanned 11 November 2026, Grype 0.121.0, linux/amd64. Medium and lower findings are not
# listed; they are reported but do not fail a High gate.
ignore:

  # --- livekit/livekit-server:v1.13.11 ---

  # golang.org/x/net v0.59.0 (go-module): upstream livekit/livekit-server:v1.13.11 has not picked up the fix yet.
  - vulnerability: GO-2026-6603  # High; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  - vulnerability: GO-2026-6611  # High; fixed in 0.60.0
    package:
      name: golang.org/x/net
      version: v0.59.0
      type: go-module
  - vulnerability: GO-2026-6612  # Critical; fixed in 0.60.0
